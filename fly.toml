# fly.toml app configuration file generated for vibemarketingbrain on 2026-10-08T08:32:45-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vibemarketingbrain'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'
  release_command = 'node_modules/.bin/tsx src/db/migrate.ts'

[env]
  JOBS_ENABLED = 'true'
  NODE_ENV = 'production'
  PORT = '5100'

[[mounts]]
  source = 'data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 5100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
