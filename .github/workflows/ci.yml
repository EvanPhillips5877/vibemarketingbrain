name: CI
# Pull requests and manual runs only. Tests run locally before every push;
# running them on push as well burned the free Actions minutes once already.
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup reads "packageManager" from package.json; do not add a version here too.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/marketingbrain_test
          PGPASSWORD: test
